@layer base {
  :root {
    --background: #0A0A0A;
    --foreground: #FAFAFA;
    --card: #111113;
    --card-foreground: #FAFAFA;
    --popover: #111113;
    --popover-foreground: #FAFAFA;
    --primary: #FAFAFA;
    --primary-foreground: #0A0A0A;
    --secondary: #1A1A1C;
    --secondary-foreground: #FAFAFA;
    --muted: #1A1A1C;
    --muted-foreground: rgba(250, 250, 250, 0.55);
    --accent: #1A1A1C;
    --accent-foreground: #FAFAFA;
    --destructive: #C8102E;
    --destructive-foreground: #ffffff;
    --border: rgba(250, 250, 250, 0.12);
    --input: rgba(250, 250, 250, 0.12);
    --ring: rgba(250, 250, 250, 0.3);
    --radius: 0rem;
  }
  * {
    border-color: var(--border);
  }
  :root {
    --red: #C8102E;
    --font-serif: 'Bodoni Moda Variable', 'Bodoni MT', Georgia, serif;
    --font-sans: 'Geist Variable', sans-serif;
  }
  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
  }
}
.layout {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 236px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: none;
}
.sidebar::-webkit-scrollbar {
  display: none;
}
.sidebar-logo {
  padding: 4px 8px;
}
.sidebar-logo-text {
  font-size: 18px;
  line-height: 1.1;
}
.brand-word {
  font-family: var(--font-serif);
  font-variation-settings: "opsz" 15;
  font-weight: 560;
  line-height: 1.1;
}
.brand-dot {
  color: var(--red);
}
.brand-sub {
  display: block;
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted-foreground);
  margin-top: 3px;
}
.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--muted-foreground);
  transition: color 0.2s, background 0.2s;
  text-decoration: none;
}
.nav-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.nav-link:hover {
  color: var(--foreground);
  background: var(--accent);
}
.nav-link.active {
  color: var(--foreground);
  background: var(--secondary);
}
.nav-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--foreground);
}
.sidebar-footer {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--muted-foreground);
}
.sidebar-email {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 8px;
}
.sidebar-footer-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.sidebar-footer-actions [data-feedback-widget] {
  position: static;
  background: none;
  box-shadow: none;
  padding: 0;
  border-radius: 0;
  font-size: 12px;
  font-family: var(--font-sans);
}
.sidebar-footer-actions [data-feedback-widget]:hover {
  background: none;
  color: var(--foreground);
}
.sidebar-collapse {
  position: absolute;
  top: 16px;
  right: -12px;
  z-index: 10;
  width: 24px;
  height: 24px;
  border: 1px solid var(--border);
  background: var(--primary);
  color: var(--primary-foreground);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
}
.sidebar-collapse:hover {
  background: var(--secondary);
  color: var(--foreground);
  border-color: var(--ring);
}
.layout.collapsed .sidebar {
  width: 52px;
}
.layout.collapsed .sidebar-logo {
  padding: 20px 0;
  justify-content: center;
}
.layout.collapsed .sidebar-logo-text, .layout.collapsed .nav-label, .layout.collapsed .sidebar-hints, .layout.collapsed .sidebar-email, .layout.collapsed .timer-widget {
  display: none;
}
.layout.collapsed .nav-link {
  padding: 10px 0;
  justify-content: center;
}
.layout.collapsed .nav-icon {
  display: block;
}
.layout.collapsed .sidebar-footer {
  padding: 16px 0;
}
.layout.collapsed .sidebar-footer-actions {
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.layout.collapsed .sidebar-footer-actions .nav-icon {
  width: 16px;
  height: 16px;
}
.layout.collapsed .sidebar-footer-actions [data-feedback-widget] {
  font-size: 0;
}
.layout.collapsed .sidebar-footer-actions [data-feedback-widget]::before {
  content: "✎";
  font-size: 12px;
}
.sidebar-footer button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: none;
  border: none;
  color: var(--muted-foreground);
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 6px 10px;
  margin: 0 -10px;
  cursor: pointer;
}
.sidebar-footer button:hover {
  color: var(--foreground);
  background: var(--accent);
}
.content {
  flex: 1;
  padding: 32px 40px 64px;
  max-width: 1200px;
  min-width: 0;
}
.content a {
  color: rgba(250, 250, 250, 0.72);
  text-decoration: none;
}
.content a:hover {
  color: var(--foreground);
}
.page-title {
  font-family: var(--font-serif);
  font-variation-settings: "opsz" 15;
  font-weight: 560;
  font-size: 30px;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.page-title-input {
  font-family: var(--font-serif);
  font-variation-settings: "opsz" 15;
  font-weight: 560;
  font-size: 30px;
  letter-spacing: -0.01em;
  background: transparent;
  border: none;
  border-bottom: 1px dashed transparent;
  padding: 0;
  color: inherit;
  width: 100%;
  max-width: 640px;
}
.page-title-input:hover, .page-title-input:focus {
  border-bottom-color: var(--ring);
  outline: none;
}
.page-subtitle {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--muted-foreground);
  margin: 0 0 28px;
}
.section-heading {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-foreground);
  margin: 32px 0 12px;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 18px 20px;
}
a.stat-card {
  display: block;
  color: inherit;
  text-decoration: none;
}
a.stat-card:hover {
  border-color: var(--ring);
}
.stat-card .label {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-foreground);
  margin-bottom: 10px;
}
.stat-card .value {
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat-card .value .unit {
  font-size: 13px;
  font-weight: 400;
  color: var(--muted-foreground);
}
.stat-card .sub {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--muted-foreground);
  margin-top: 6px;
}
.progress {
  height: 6px;
  background: var(--secondary);
  overflow: hidden;
  margin-top: 12px;
}
.progress-fill {
  height: 100%;
  background: var(--foreground);
  transition: width 0.4s;
}
.progress-fill.over {
  background: var(--red);
}
.table {
  width: 100%;
  border-collapse: collapse;
}
.table th {
  text-align: left;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted-foreground);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-sans);
  font-size: 14px;
  vertical-align: middle;
}
.table tr:last-child td {
  border-bottom: 0;
}
.table td.hours {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.table tbody tr:hover td {
  background: rgba(250, 250, 250, 0.03);
}
.table-wrap {
  border: 1px solid var(--border);
  background: var(--card);
}
.table-wrap .table td {
  border-bottom: 1px solid var(--border);
}
.table-wrap tr:last-child td {
  border-bottom: 0;
}
.badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border: 1px solid var(--border);
  color: var(--muted-foreground);
  white-space: nowrap;
}
.badge-active {
  border-color: rgba(250, 250, 250, 0.3);
  color: var(--foreground);
}
.badge-completed {
  background: rgba(250, 250, 250, 0.08);
  color: var(--foreground);
  border-color: transparent;
}
.badge-over {
  border-color: rgba(200, 16, 46, 0.5);
  color: var(--red);
}
.stat-card .value-muted {
  color: rgba(250, 250, 250, 0.28);
  font-size: 24px;
}
.stat-card .value-error {
  color: var(--red);
  font-size: 24px;
}
.stat-card .sub-error {
  color: var(--red);
}
.stat-grid-muted {
  margin-top: 12px;
}
.stat-card-placeholder {
  border-style: dashed;
}
.stat-card-placeholder .label {
  color: var(--muted-foreground);
}
.section-aside {
  float: right;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--red);
}
.form-group {
  margin-bottom: 16px;
}
.form-group label, label {
  display: block;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-foreground);
  margin-bottom: 8px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid var(--input);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  transition: border-color 0.2s;
}
.form-group textarea {
  height: auto;
  padding: 10px 12px;
  resize: vertical;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--ring);
}
.form-group input::placeholder, .form-group textarea::placeholder {
  color: rgba(250, 250, 250, 0.3);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--card-foreground);
  padding: 24px;
}
.card + .card {
  margin-top: 12px;
}
.board {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-inline: -40px;
  padding-inline: 40px;
  scrollbar-width: thin;
}
.board::-webkit-scrollbar {
  height: 8px;
}
.board::-webkit-scrollbar-thumb {
  background: rgba(127, 127, 127, 0.35);
  border-radius: 0;
}
.board-col {
  flex: 0 0 260px;
  background: rgba(127, 127, 127, 0.06);
  border-radius: 0;
  padding: 10px;
  min-height: 160px;
}
.board-col.drag-over {
  outline: 2px dashed rgba(250, 250, 250, 0.3);
  outline-offset: -2px;
}
.board-col-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 10px;
}
.board-col-count {
  margin-left: auto;
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 400;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 0;
  flex: 0 0 auto;
}
.board-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.board-card {
  background: var(--card);
  border: 1px solid rgba(127, 127, 127, 0.25);
  border-radius: 0;
  padding: 10px 12px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.board-card.dragging {
  opacity: 0.5;
}
.prospect-modal {
  border: 1px solid rgba(127, 127, 127, 0.25);
  border-radius: 0;
  background: var(--card);
  color: var(--foreground);
  padding: 20px;
  width: min(560px, calc(100vw - 32px));
  max-height: min(720px, calc(100vh - 64px));
  overflow-y: auto;
  user-select: text;
  -webkit-user-select: text;
}
.prospect-modal::backdrop {
  background: rgba(0, 0, 0, 0.4);
}
[cmdk-overlay] {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.25);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 120px 16px 0;
}
[cmdk-dialog] {
  position: fixed;
  top: 120px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 101;
  width: 520px;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border-top: 1px solid var(--foreground);
  border-bottom: 1px solid var(--foreground);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  overflow: hidden;
  outline: none;
}
[cmdk-input] {
  width: 100%;
  padding: 14px 16px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  color: inherit;
  outline: none;
}
[cmdk-list] {
  margin: 0;
  padding: 0 0 6px;
  list-style: none;
  max-height: 330px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
[cmdk-empty] {
  padding: 14px 16px;
  font-size: 14px;
  color: var(--muted-foreground);
}
[cmdk-item] {
  padding: 10px 16px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
}
[cmdk-item][data-selected="true"] {
  background: rgba(250, 250, 250, 0.08);
}
.sidebar-hints {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 8px;
  font-size: 11px;
  color: var(--muted-foreground);
}
.sidebar-hints > div {
  display: flex;
  align-items: center;
  gap: 4px;
}
.sidebar-hints span {
  margin: 0 6px 0 4px;
}
.sidebar-hints kbd {
  font-family: ui-monospace, monospace;
  font-size: 10px;
  background: var(--secondary);
  border: 1px solid var(--border);
  padding: 1px 5px;
  color: var(--foreground);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;

.mention-popover {
  position: fixed;
  z-index: 61;
  width: 280px;
  background: var(--popover);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 0;
  padding: 10px 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  display: grid;
  gap: 4px;
}
.mention-popover-loading {
  color: #999;
  font-size: 12px;
}
.mention-popover-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mention-popover-kind {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--foreground);
}
.mention-popover-status {
  margin-left: auto;
  font-size: 11px;
  color: #eee;
  background: rgba(250, 250, 250, 0.1);
  border-radius: 0;
  padding: 1px 7px;
}
.mention-popover-status.mention-popover-deleted {
  background: rgba(120, 120, 120, 0.25);
  text-decoration: line-through;
}
.mention-popover-title {
  font-size: 14px;
  font-weight: 600;
  color: #eee;
}
.mention-popover-subtitle {
  font-size: 12px;
  color: #999;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mention-popover-meta {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 11px;
  color: #777;
}
.mention-popover-meta a {
  color: var(--foreground);
  text-decoration: none;
}
.mention-popover-meta a:hover {
  text-decoration: underline;
}
.lava-glow {
  background: radial-gradient( 60% 90% at 50% 100%, rgba(200, 16, 46, 0.32), rgba(200, 16, 46, 0.09) 45%, transparent 72% );
  transform-origin: 50% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .lava-glow {
    animation: lava-breathe 16s ease-in-out infinite alternate;
  }
}
@keyframes lava-breathe {

  }

.serif-display {

}
@keyframes chev-bob {

}
.mobile-topbar {
  display: none;
}
.sidebar-backdrop {
  display: none;
}
@media (max-width: 900px) {
  .layout {
    display: block;
  }
  .mobile-topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--background);
    border-bottom: 1px solid var(--border);
    padding: 4px 8px 4px 0;
    padding-top: calc(4px + env(safe-area-inset-top));
  }
  .mobile-menu {
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 0;
    color: var(--foreground);
    cursor: pointer;
  }
  .mobile-topbar .sidebar-logo-text {
    font-size: 16px;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    height: 100dvh;
    width: 280px;
    max-width: 86vw;
    z-index: 60;
    background: var(--background);
    box-shadow: 8px 0 32px rgba(0, 0, 0, 0.5);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .layout.mobile-open .sidebar {
    transform: none;
  }
  .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .layout.mobile-open .sidebar-backdrop {
    opacity: 1;
    pointer-events: auto;
  }
  .sidebar-collapse {
    display: none;
  }
  .layout.collapsed .sidebar {
    width: 280px;
  }
  .layout.collapsed .sidebar-logo {
    padding: 4px 8px;
    justify-content: flex-start;
  }
  .layout.collapsed .sidebar-logo-text, .layout.collapsed .nav-label {
    display: inline;
  }
  .layout.collapsed .sidebar-hints {
    display: flex;
  }
  .layout.collapsed .sidebar-email, .layout.collapsed .timer-widget {
    display: block;
  }
  .layout.collapsed .nav-link {
    padding: 7px 10px;
    justify-content: flex-start;
  }
  .layout.collapsed .sidebar-footer {
    padding-top: 12px;
  }
  .layout.collapsed .sidebar-footer-actions {
    flex-direction: row;
    align-items: stretch;
    gap: 14px;
  }
  .layout.collapsed .sidebar-footer-actions [data-feedback-widget] {
    font-size: revert;
  }
  .layout.collapsed .sidebar-footer-actions [data-feedback-widget]::before {
    content: none;
  }
  .content {
    padding: 20px 16px 48px;
  }
  .board {
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
  .table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .doc-shell {
    flex-direction: column;
    gap: 20px;
  }
  .doc-history {
    width: auto;
    position: static;
    max-height: none;
    border-left: none;
    padding-left: 0;
  }
  .doc-pager {
    width: auto;
    margin: 8px 0 20px;
    padding-top: 0;
  }
  .doc-sheet {
    display: none;
  }
  .doc-title, .doc-editor {
    width: 100%;
  }
  .doc-firstcomment {
    flex-wrap: wrap;
  }
  .doc-topbar {
    gap: 8px;
  }
}

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap');
/* ═══════════════════════════════════════════════════════════════
   Basalt marketing — Franco Maria Ricci Editore design system
   Ported from marketing/src/styles/global.css. Body-level rules are
   scoped to :has(.mk-root) so the admin app never inherits the serif
   vellum treatment, and marketing pages never fight app.css.
   ═══════════════════════════════════════════════════════════════ */

:root {
    /* Force light scheme — opts out of Chrome/Edge Auto Dark Theme */
    color-scheme: only light;

    /* Colors */
    --color-vellum-white: #f6f6f6;
    --color-paper: #ffffff;
    --color-gallery-ink: #0a0a0a;
    --color-letterpress-black: #000000;
    --color-silver-wash: #b3b3b3;
    --color-burnished-gold: #bc9c5c;

    /* Typography — Font Families */
    --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-serif-italic: 'Playfair Display', Georgia, serif;
    --font-sans: 'Arial', Helvetica, -apple-system, 'Segoe UI', sans-serif;

    /* Typography — Scale */
    --text-caption: 12px;
    --text-body-sm: 14px;
    --text-body: 16px;
    --text-subheading: 22px;
    --text-heading: 42px;

    /* Leading */
    --leading-display: 0.95;
    --leading-body: 1.25;

    /* Spacing */
    --spacing-8: 8px;
    --spacing-16: 16px;
    --spacing-20: 20px;
    --spacing-24: 24px;
    --spacing-32: 32px;
    --spacing-40: 40px;
    --spacing-48: 48px;
    --spacing-64: 64px;
    --spacing-80: 80px;
    --spacing-128: 128px;

    /* Layout */
    --page-max-width: 1280px;
    --section-gap: 48px;
    --card-padding: 40px;
    --element-gap: 20px;

    /* Surfaces */
    --surface-vellum: #f6f6f6;
    --surface-paper: #ffffff;
    --surface-silver-wash: #b3b3b3;
    --surface-gallery-ink: #0a0a0a;
    --surface-letterpress-black: #000000;
}

html:has(.mk-root) {
    scroll-behavior: smooth;
}

body:has(.mk-root) {
    background: var(--color-vellum-white);
    color: var(--color-letterpress-black);
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: var(--text-body);
    line-height: var(--leading-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color-scheme: only light;
}

.mk-root ::selection {
    background: var(--color-burnished-gold);
    color: var(--color-vellum-white);
}

.mk-root a {
    color: inherit;
    text-decoration: none;
}

.mk-root img {
    display: block;
    max-width: 100%;
}

/* ═══ Top Bar (shared across all pages) ═══ */
.mk-root .top-bar {
    padding: var(--spacing-40) var(--spacing-64);
}
.mk-root .top-bar-inner {
    display: flex;
    justify-content: flex-start;
    align-items: center;
}
.mk-root .logo-link {
    display: block;
}
.mk-root .top-bar-signin {
    margin-left: auto;
    font-family: var(--font-sans);
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--color-letterpress-black);
    background: var(--color-paper);
    border: 1px solid var(--color-letterpress-black);
    padding: 8px 18px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.mk-root .top-bar-signin:hover {
    background: var(--color-letterpress-black);
    color: var(--color-paper);
}
.mk-root .logo-wordmark {
    font-size: 26px;
    color: var(--color-letterpress-black);
}

/* ═══ Editorial Components ═══ */
.mk-root .section-title {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: var(--text-subheading);
    text-align: center;
    color: var(--color-letterpress-black);
    margin-bottom: var(--spacing-16);
}

.mk-root .section-rule {
    width: 100%;
    height: 1px;
    background: var(--color-burnished-gold);
    border: none;
