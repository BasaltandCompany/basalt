<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>MadCactus connect queue</title>
		<style>
			body {
				width: 340px;
				margin: 0;
				padding: 12px;
				font: 13px/1.45 system-ui, sans-serif;
				color: #1f2937;
			}
			.hdr {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				margin-bottom: 8px;
			}
			.hdr b {
				font-size: 14px;
			}
			.cap {
				color: #0e6b4f;
				font-weight: 600;
			}
			.cap.zero {
				color: #b91c1c;
			}
			.row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				padding: 8px 0;
				border-bottom: 1px solid #e5e7eb;
			}
			.row:last-child {
				border-bottom: none;
			}
			.who b {
				display: block;
			}
			.who a {
				color: #6b7280;
				font-size: 12px;
				text-decoration: none;
			}
			.who a:hover {
				text-decoration: underline;
			}
			.done {
				border: 1px solid #0e6b4f;
				background: #fff;
				color: #0e6b4f;
				border-radius: 999px;
				padding: 4px 10px;
				font-size: 12px;
				cursor: pointer;
				white-space: nowrap;
			}
			.done:hover {
				background: #0e6b4f;
				color: #fff;
			}
			.settings {
				display: flex;
				gap: 6px;
				margin-bottom: 10px;
			}
			.settings input {
				flex: 1;
				min-width: 0;
				padding: 5px 7px;
				border: 1px solid #d1d5db;
				border-radius: 6px;
				font-size: 12px;
			}
			.settings button {
				padding: 5px 10px;
				border: 1px solid #d1d5db;
				background: #f9fafb;
				border-radius: 6px;
				font-size: 12px;
				cursor: pointer;
			}
			.msg {
				padding: 14px 0;
				color: #6b7280;
			}
			.err {
				color: #b91c1c;
			}
		</style>
	</head>
	<body>
		<div class="hdr">
			<b>Connect queue</b>
			<span class="cap" id="cap"></span>
		</div>
		<div class="settings">
			<input id="url" placeholder="https://basalt.ac" />
			<input id="key" type="password" placeholder="mc_ admin key" style="flex: 0.8" />
			<button id="save">Save</button>
		</div>
		<div id="list"></div>
		<script src="popup.js"></script>
	</body>
</html>
